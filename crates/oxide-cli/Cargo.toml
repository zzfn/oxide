[package]
name = "oxide-cli"
version = "0.1.0"
edition = "2021"
description = "命令行界面"

[dependencies]
oxide-core = { path = "../oxide-core" }
oxide-provider = { path = "../oxide-provider" }
oxide-tools = { path = "../oxide-tools" }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "scrolling-regions", "unstable-widget-ref"] }
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
termimad = "0.30"
colored = "3.0"
dirs = "5.0"
dialoguer = "0.11"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
rig-core = "0.29"
futures = "0.3"
indicatif = "0.17"

# Markdown rendering
pulldown-cmark = "0.12"

# Diff rendering
diffy = "0.4"

# Token 计数
tiktoken-rs = "0.6"
once_cell = "1.20"

# Langfuse tracing
opentelemetry = "0.31"
opentelemetry-langfuse = "0.6"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
tracing-opentelemetry = "0.32"
tracing-subscriber = "0.3"

[[bin]]
name = "oxide"
path = "src/main.rs"
